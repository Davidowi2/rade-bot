# Render blueprint for the read-only mirror service.
#
# Free-tier facts this file is built around (render.com/docs/free, checked
# 2026-11-12):
#   * Free instances exist for Web Service / Postgres / Key Value only.
#     "Other service types don't support Free instances" - so there is no free
#     background worker and no free cron job. The listener therefore runs as a
#     thread inside this web service.
#   * A free web service spins down after 15 minutes without inbound traffic and
#     takes about a minute to spin back up.
#   * The filesystem is ephemeral: it is wiped on redeploy, restart and
#     spin-down. That is why Supabase is the store and why the listener cursor is
#     recovered from the database rather than from a file.
#
# Consequence, stated plainly: this is not a 24/7 listener. An external monitor
# pinging /healthz every few minutes prevents most spin-downs, but Render may
# still restart a free service at any time, and any gap is recovered on restart
# by the cursor plus the database's uniqueness constraint.
services:
  - type: web
    name: rade-mirror
    runtime: python
    plan: free
    region: frankfurt
    branch: feature/tradelocker-demo-execution
    buildCommand: pip install -r requirements-mirror.txt
    startCommand: python -m rade.observer.service
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYTHONPATH
        value: src

      # --- set these in the Render dashboard; never commit values ---
      - key: MIRROR_API_TOKEN          # bearer token for /api/*
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # backend only; never in Vercel
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION          # StringSession, survives redeploys
        sync: false
      - key: TELEGRAM_CHANNEL
        value: "@XAUUSD_FOREX4"
      - key: TELEGRAM_BOT_TOKEN        # BotFather notifications
        sync: false
      - key: TELEGRAM_NOTIFY_CHAT_ID
        sync: false
      - key: MIRROR_EQUITY             # paper equity; never guessed
        sync: false

      # --- non-secret settings ---
      - key: MIRROR_RUN_LISTENER
        value: "1"
      # The contract size is NOT committed here. It was read once from a
      # broker response and has never been confirmed by a fill, so a preset
      # number here would silently size every intent with an unverified
      # value. The value may be left empty: while the contract size is
      # unconfirmed the listener still starts and records every message as
      # blocked rather than sized. It becomes required the moment
      # MIRROR_CONTRACT_UNITS_CONFIRMED=1 is set, and it must be entered in
      # the dashboard after being checked against the broker's own
      # specification.
      - key: MIRROR_CONTRACT_UNITS_PER_LOT
        sync: false
      - key: MIRROR_CONTRACT_UNITS_CONFIRMED
        sync: false
      # "none" means no verified quote source: market (NOW) calls are blocked
      # because they cannot be priced. Switch to "tradelocker" only after a
      # demo login works.
      - key: MIRROR_QUOTE_PROVIDER
        value: "none"
      - key: MIRROR_QUOTE_MAX_AGE_S
        value: "2"
      - key: MIRROR_RECONNECT_S
        value: "900"
      # Where the very first activation starts. "latest" means: import
      # nothing that is already in the channel when the mirror is switched
      # on. An explicit message id imports from there; "history" imports
      # everything and additionally needs MIRROR_ALLOW_HISTORY_IMPORT=1.
      - key: MIRROR_START_AT
        value: "latest"
      - key: MIRROR_ALLOW_HISTORY_IMPORT
        value: "0"
      # How often failed notifications are retried.
      - key: MIRROR_NOTIFY_RETRY_S
        value: "300"
      # How old a listener heartbeat may be before the service reports itself
      # unhealthy (503 on /healthz, which makes Render restart the service).
      - key: MIRROR_HEALTH_MAX_AGE_S
        value: "90"
      - key: MIRROR_STATE
        value: "/tmp/mirror_state.json"
      - key: MIRROR_HEARTBEAT
        value: "/tmp/mirror_listener.heartbeat.json"

      # --- demo execution path ---
      # 0 keeps this a paper mirror. 1 places real orders in the TradeLocker
      # DEMO account: the gateway refuses any other environment, and there is
      # no live-account code path to switch on. It also requires
      # MIRROR_CONTRACT_UNITS_CONFIRMED=1 with a contract size that matches
      # the broker's own lotSize; otherwise the service refuses to start
      # rather than run an executor that could only block every signal.
      - key: MIRROR_EXECUTE
        value: "0"
      - key: MIRROR_MANAGE_EVERY_S
        value: "5"
      - key: MIRROR_FILL_TIMEOUT_S
        value: "300"

      # --- pre-trade risk controls ---
      # These gate NEW orders only. An open trade is always still managed,
      # because abandoning open risk is worse than the loss a breaker caps.
      # Set any of them to 0 to switch that check off; the service logs which
      # ones are off at startup and reports them on /api/status as "disabled",
      # so a switched-off control cannot be mistaken for a passing one.
      - key: MIRROR_MAX_OPEN_POSITIONS
        value: "3"
      - key: MIRROR_DAILY_LOSS_FRACTION   # of the day's opening equity
        value: "0.02"
      - key: MIRROR_MAX_DRAWDOWN_FRACTION # of the peak equity
        value: "0.05"
      - key: MIRROR_MAX_SPREAD            # price units; XAUUSD is ~0.2
        value: "5"
      - key: MIRROR_MAX_SLIPPAGE          # price units from the published entry
        value: "5"
      # The channel re-posts the same call as a second message with its own id,
      # and the id-based uniqueness constraint cannot see that they are one
      # idea. An identical text inside this window is copied once. 0 disables
      # the check, which is not recommended: the channel demonstrably does it.
      - key: MIRROR_DUPLICATE_WINDOW_S
        value: "900"
      # The TradeLocker demo credentials, when the execution path is enabled.
      - key: TRADELOCKER_EMAIL
        sync: false
      - key: TRADELOCKER_PASSWORD
        sync: false
      - key: TRADELOCKER_SERVER
        sync: false
      - key: TRADELOCKER_ACCOUNT_ID
        sync: false
      - key: TRADELOCKER_ENV
        value: "demo"
